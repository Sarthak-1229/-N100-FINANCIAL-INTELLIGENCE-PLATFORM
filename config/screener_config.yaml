# config/screener_config.yaml
# Screener threshold definitions - analyst editable

# Metric column mappings
metrics:
  roe_min: "return_on_equity_pct"
  de_max: "debt_to_equity"
  fcf_min: "free_cash_flow_cr"
  revenue_cagr_5yr_min: "revenue_cagr_5yr"
  pat_cagr_5yr_min: "pat_cagr_5yr"
  opm_min: "operating_profit_margin_pct"
  pe_max: "pe_ratio"
  pb_max: "pb_ratio"
  div_yield_min: "dividend_yield_pct"
  icr_min: "interest_coverage"
  market_cap_min: "market_cap_crore"
  net_profit_min: "net_profit"
  eps_cagr_min: "eps_cagr_5yr"
  asset_turnover_min: "asset_turnover"
  sales_min: "sales"

# Preset screeners
presets:
  quality_compounder:
    description: "High quality compounders with strong returns, low debt, positive FCF, revenue growth"
    roe_min: 15
    de_max: 1.0
    fcf_min: 0
    revenue_cagr_5yr_min: 10

  value_pick:
    description: "Value stocks with low P/E, P/B, moderate debt, dividend yield"
    pe_max: 20
    pb_max: 3.0
    de_max: 2.0
    div_yield_min: 1.0

  growth_accelerator:
    description: "High growth companies with strong PAT/revenue CAGR, manageable debt"
    pat_cagr_5yr_min: 20
    revenue_cagr_5yr_min: 15
    de_max: 2.0

  dividend_champion:
    description: "Dividend-paying companies with high yield, sustainable payout, positive FCF"
    div_yield_min: 2.0
    dividend_payout_max: 80
    fcf_min: 0

  debt_free_blue_chip:
    description: "Large, debt-free companies with strong ROE"
    de_max: 0
    roe_min: 12
    sales_min: 5000

  turnaround_watch:
    description: "Revenue accelerating, latest FCF positive, debt declining"
    revenue_cagr_3yr_min: 10
    fcf_latest_positive: true
    de_declining_yoy: true